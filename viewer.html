<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text viewer — Sanskrit Search</title>
<style>
 /* Bundled Devanāgarī webfont (Noto Serif Devanagari, OFL) so the reading column looks identical on
    every device instead of depending on the visitor's system fonts. */
 @font-face{font-family:'Noto Serif Devanagari';font-style:normal;font-weight:400;font-display:swap;
   src:url('fonts/NotoSerifDevanagari-Regular.woff2') format('woff2');}
 @font-face{font-family:'Noto Serif Devanagari';font-style:normal;font-weight:600;font-display:swap;
   src:url('fonts/NotoSerifDevanagari-SemiBold.woff2') format('woff2');}
 body{font-family:system-ui,sans-serif;margin:0;background:#faf9f7;color:#222}
 header{background:#3a2f2a;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
 header a{color:#ffd9a8;text-decoration:none}
 header .title{font-weight:600}
 header .nav{margin-left:auto;display:flex;gap:8px;align-items:center}
 header button,header input{font-size:14px;padding:5px 9px;border:1px solid #6b5a4e;border-radius:5px;background:#4a3d36;color:#fff}
 header input{width:64px;text-align:center}
 /* Reading column — real HTML text, so verse pādas keep their own lines and the browser handles
    Devanāgarī shaping natively (font stack prefers Sanskrit-grade faces, falls back per device). */
 #page{max-width:760px;margin:24px auto;padding:0 20px 60px;font-family:'Noto Serif Devanagari','Shobhika','Shree Devanagari 714','Kohinoor Devanagari',serif;
   font-size:22px;line-height:2.05;color:#1a1a1a}
 /* Layout-reconstructed pages (build_layout_pages.py): each scan line is its own element positioned
    by its geometry — centered lines, left-title+right-page-number entry rows with dotted leaders, and
    indented lines (padding-left inline). Tighter line-height since each div IS one visual line. */
 #page.layout{font-size:19px;line-height:1.75}
 .lp-c{text-align:center;margin:.35em 0}
 .lp-x{margin:0}
 .lp-e{display:flex;align-items:baseline;gap:8px;margin:.1em 0}
 .lp-e .lp-t{flex:0 1 auto;font-weight:600}
 .lp-e .lp-l{flex:1 1 auto;border-bottom:1px dotted #b9b0a2;transform:translateY(-.28em);margin:0 4px}
 .lp-e .lp-p{flex:0 0 auto;color:#555}
 .layout .gap{margin-top:.9em}
 .layout .big{font-size:1.3em;line-height:1.5}       /* mūla / headings — printed larger */
 .layout .sm{font-size:.85em}                          /* fine-print notes */
 hr.lp-r{border:0;border-top:1px solid #cbbfa8;width:38%;margin:.8em auto}
 /* pratīka (mūla words quoted in commentary), from the PDF's own bold/italic runs (BG). */
 .layout b{font-weight:600;color:#5a3e00}
 .layout i{font-style:italic}
 mark{background:#ffe08a;padding:0 1px;border-radius:2px}
 mark.hl{background:#ffcf4d;box-shadow:0 0 0 3px #ffe9b0}
 #status{color:#777;font-size:13px;padding:8px 20px;max-width:760px;margin:0 auto}
</style></head><body>
<header>
 <a href="index.html">← search</a>
 <span class="title" id="title">…</span>
 <span class="nav">
   <button id="prev">‹ prev</button>
   <span style="color:#e8dccb;font-size:13px">page <input id="pageIn" type="number" min="1"></span>
   <button id="next">next ›</button>
   <a id="scanLink" href="#" target="_blank" rel="noopener" style="font-size:13px;display:none">scan ↗</a>
 </span>
</header>
<div id="status">loading…</div>
<div id="page"></div>
<script>
// Self-hosted HTML viewer for texts we host ourselves (no advaitasharada/gitasupersite home). Deep-
// linked from search.html as viewer.html?text=<id>&page=<n>&hl=<matched-surface>. It renders the
// clean per-page text (texts/<slug>/pages.js) and highlights the exact sandhi SURFACE that produced
// the hit — the same matched substring search.html hands advaitasharada as hlBhashya. Whitespace-
// tolerant match (the block/hl text collapsed spaces; the page text keeps newlines/multiple spaces),
// so the highlight lands even across a line break. Better than the PDF: real highlight, native
// Ctrl-F, no page-fit/alignment quirks. Scan of the same page stays one click away (scan ↗).
const TEXTS={
 'panchadashi-ramkrishna':{title:'Pañcadaśī (Rāmakṛṣṇa-ṭīkā)', data:'texts/panchadashi/pages.js',
   scanDir:'texts/panchadashi-scan', slug:'panchadashi', size:40},
 'bg-bhashya':{title:'Bhagavad-gītā Śāṅkara-bhāṣya (+ ṭīkās)', data:'texts/bg-bhashya/pages.js',
   scanDir:'texts/bg-bhashya', slug:'bg-bhashya', size:40},
 'dakshinamurti-stotra':{title:'Dakṣiṇāmūrti-stotra — Mānasollāsa & Tattvasudhā', data:'texts/dakshinamurti/pages.js',
   scanDir:'texts/dakshinamurti-scan', slug:'dakshinamurti', size:40},
 'brihadaranyaka-vartika-sara':{title:'Bṛhadāraṇyaka-vārtika-sāra (Vidyāraṇya)', data:'texts/bavs/pages.js',
   scanDir:'texts/bavs-scan', slug:'bavs', size:40},
 'siddhantabindu':{title:'Siddhāntabindu — Daśaślokī (Madhusūdana Sarasvatī)', data:'texts/siddhantabindu/pages.js',
   scanDir:'texts/siddhantabindu-scan', slug:'siddhantabindu', size:40},
 'naishkarmyasiddhi':{title:'Naiṣkarmyasiddhi (Sureśvarācārya)', data:'texts/naishkarmyasiddhi/pages.js',
   scanDir:'texts/naishkarmyasiddhi-scan', slug:'naishkarmyasiddhi', size:40},
 'vicharasagara':{title:'Vicāra-sāgara (Vāsudeva Brahmendra Sarasvatī)', data:'texts/vicharasagara/pages.js',
   scanDir:'texts/vicharasagara-scan', slug:'vicharasagara', size:40},
 'anubhutiprakasha':{title:'Anubhūti-prakāśa (Vidyāraṇya)', data:'texts/anubhutiprakasha/pages.js',
   scanDir:'texts/anubhutiprakasha-scan', slug:'anubhutiprakasha', size:40},
 'upadeshasahasri':{title:'Upadeśasāhasrī (Śaṅkara) — Ānandagiri-ṭīkā', data:'texts/upadeshasahasri/pages.js',
   scanDir:'texts/upadeshasahasri-scan', slug:'upadeshasahasri', size:40},
 'vedantasara':{title:'Vedāntasāra (Sadānanda) — Subodhinī & Vidvanmanorañjanī', data:'texts/vedantasara/pages.js',
   scanDir:'texts/vedantasara-scan', slug:'vedantasara', size:40},
 'advaita-makaranda':{title:'Advaita-makaranda (Lakṣmīdhara) — Rasābhivyañjikā-ṭīkā (Svayamprakāśa)',
   data:'texts/advaita-makaranda/pages.js', slug:'advaita-makaranda'},   // digital text, flat, no scan
};
// Texts whose pages.js holds RECONSTRUCTED LAYOUT HTML (build_layout_pages.py) rather than flat text.
// For these the page string is injected as HTML; the rest (e.g. bg-bhashya, built from index blocks)
// stays flat text with <br>.
const LAYOUT=new Set(['panchadashi-ramkrishna','dakshinamurti-stotra','brihadaranyaka-vartika-sara',
 'siddhantabindu','naishkarmyasiddhi','vicharasagara','anubhutiprakasha','upadeshasahasri','vedantasara',
 'bg-bhashya']);
const P=new URLSearchParams(location.search);
const id=P.get('text'), hl=P.get('hl')||'';
let page=Math.max(1,parseInt(P.get('page')||'1',10));
const cfg=TEXTS[id];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function go(p){const u=new URL(location.href);u.searchParams.set('page',p);u.searchParams.delete('hl');location.href=u.toString();}
// Highlight the matched sandhi surface across the rendered DOM's text nodes (whitespace-tolerant),
// safe over reconstructed HTML — we never string-replace into the markup, only wrap matches inside
// individual text nodes. Matches confined to one text node (one visual line); a match split across
// lines simply isn't highlighted (rare, acceptable).
function highlightIn(container){
 if(!hl) return;
 let re; try{re=new RegExp(reEsc(hl).replace(/\s+/g,'\\s+'),'g');}catch(e){return;}
 const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,null);
 const targets=[]; let n;
 while((n=walker.nextNode())){re.lastIndex=0; if(n.nodeValue&&re.test(n.nodeValue))targets.push(n);}
 for(const node of targets){
   const text=node.nodeValue,frag=document.createDocumentFragment(); let last=0,mm; re.lastIndex=0;
   while((mm=re.exec(text))){
     if(mm.index>last)frag.appendChild(document.createTextNode(text.slice(last,mm.index)));
     const mk=document.createElement('mark');mk.className='hl';mk.textContent=mm[0];frag.appendChild(mk);
     last=mm.index+mm[0].length; if(mm.index===re.lastIndex)re.lastIndex++;
   }
   if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
   node.parentNode.replaceChild(frag,node);
 }
}
function render(){
 const pages=(window.TEXT_PAGES||{})[id]||{};
 const total=Object.keys(pages).length;
 document.getElementById('title').textContent=cfg.title;
 document.getElementById('pageIn').value=page; document.getElementById('pageIn').max=total;
 if(cfg.scanDir){const start=Math.floor((page-1)/cfg.size)*cfg.size+1,local=((page-1)%cfg.size)+1;
   const a=document.getElementById('scanLink');a.href=`${cfg.scanDir}/${cfg.slug}-${String(start).padStart(4,'0')}.pdf#page=${local}`;a.style.display='';}
 const raw=pages[String(page)]; const el=document.getElementById('page');
 if(raw==null){document.getElementById('status').textContent=`page ${page} not found`;el.textContent='';return;}
 document.getElementById('status').textContent=`page ${page} of ${total}`+(hl?` · highlighting “${hl}”`:'');
 if(LAYOUT.has(id)){el.className='layout';el.innerHTML=raw;}          // reconstructed layout HTML
 else{el.className='';el.innerHTML=esc(raw).replace(/\n/g,'<br>');}   // flat text (e.g. bg-bhashya)
 highlightIn(el);
 const m=el.querySelector('mark.hl'); if(m)m.scrollIntoView({block:'center'});
}
document.getElementById('prev').onclick=()=>{if(page>1)go(page-1);};
document.getElementById('next').onclick=()=>go(page+1);
document.getElementById('pageIn').addEventListener('change',e=>{const v=parseInt(e.target.value,10);if(v>=1)go(v);});
if(!cfg){document.getElementById('status').textContent='unknown text: '+id;}
else{const s=document.createElement('script');s.src=cfg.data;s.onload=render;s.onerror=()=>{document.getElementById('status').textContent='could not load text data';};document.head.appendChild(s);}
</script></body></html>
